services:
  postgres:
    image: postgres:16-alpine
    container_name: gotago_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gotago
      # Senha só para desenvolvimento local. Na DATABASE_URL o "#" é escrito como %23.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Gota2026Go#}
      POSTGRES_DB: gotago_db
    ports:
      # Se já houver um PostgreSQL na 5432, use POSTGRES_PORT=5433 no .env (e na DATABASE_URL).
      # 127.0.0.1: o banco não fica exposto para a rede
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotago -d gotago_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
